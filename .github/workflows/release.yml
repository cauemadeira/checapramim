name: Release

# Ao publicar uma Release no GitHub (Releases > Draft a new release > escolher/criar a tag, ex.: v0.1.0),
# gera os pacotes e anexa os arquivos a essa Release.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Gerar pacotes
        run: python3 scripts/build.py
      - name: Anexar arquivos à Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            dist/checapramim.zip dist/checapramim-arquivo-unico.zip dist/SKILL.md \
            --clobber
